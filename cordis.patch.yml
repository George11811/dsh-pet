# 蓝色大肥鱼桌宠（dsh-fish-pet）bundle 层。
#
# 素材分两处：
#   res/             素材库：桌宠压缩包（.7z / .zip）丢这里
#   assets/<桌宠>/    运行时目录：res/ 里的包解压出来的素材，Host 半边递归提供给浏览器
#
# 两件事分开看：
#   1. 扫描 assets/ → 宠物/动画/池子（花名册）：**运行时按需做**（GET /fish-pet/__roster，
#      结果在内存里缓存 5 秒 + 磁盘上缓存每个 GIF 的一轮时长）。所以往 assets/ 丢一个目录、
#      或者删掉一只宠物，面板里点「重扫」就生效 —— 不用重启、不用重新构建。
#   2. 解压 res/ 的压缩包：面板上的「导入」按钮（POST /fish-pet/__import）会做；
#      命令行等价物是 node tools/build-client.mjs，它额外把数据写进 lib/client.js 当离线兜底。
# 重启 dsh 本身不解压 —— 除非把下面的 buildOnStart 设为 true：那样 Host 启动时若发现
# assets/ 是空的，会在后台自动跑一次生成脚本（不阻塞启动）。
- insert:
    - id: fish-pet
      name: dsh-fish-pet
      config:
        # 素材目录。留空 = 默认 <包>/assets，并且递归查找（多宠物切换的正常状态）。
        # assetDir: '...'
        # 素材库目录，默认 <包>/res；一般不用改
        # resDir: '...'
        routePrefix: /fish-pet
        # 浏览器缓存秒数（图片内容不变，所以给得比较长）
        cacheSeconds: 604800
        # assets/ 空的时候自动构建一次（后台执行；失败只记日志，不影响 dsh 启动）
        buildOnStart: true
